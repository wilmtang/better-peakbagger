<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Send GPX to Gaia</title>
<style>
  :root { color-scheme: light dark; font: 13px/1.5 system-ui, sans-serif; }
  body { width: 304px; margin: 0; padding: 20px; background: light-dark(#fff, #202322); color: light-dark(#202822, #edf1ed); }
  h1 { font-size: 18px; line-height: 1.3; margin: 0 0 8px; letter-spacing: -.3px; }
  p { margin: 0 0 16px; }
  .label { font-size: 10px; font-weight: 650; letter-spacing: 1px; text-transform: uppercase; color: light-dark(#536658, #a9beaf); margin-bottom: 8px; }
  button { width: 100%; border: 0; border-radius: 8px; padding: 10px 14px; font: 600 13px/1.4 system-ui; background: light-dark(#24593b, #a4d4b3); color: light-dark(#fff, #102b19); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 3px solid light-dark(#538365, #e1f4e7); outline-offset: 3px; }
  #open { margin-top: 10px; }
  #status { margin: 14px 0 0; overflow-wrap: anywhere; }
  .note { color: light-dark(#5f685f, #b4beb5); font-size: 12px; margin: 12px 0 0; }
  [hidden] { display: none !important; }
</style>
<body>
<p class="label">Better Peakbagger · Prototype</p>
<h1>Send GPX to Gaia</h1>
<p>Prepare this ascent’s saved GPS track in Gaia for review.</p>
<button id="send" type="button" disabled>Prepare in Gaia</button>
<button id="open" type="button" hidden>Open Gaia</button>
<p class="note">Sign into Gaia in this browser first. Review and save in Gaia after the transfer.</p>
<p id="status" role="status" aria-live="polite"></p>
<script src="popup.js"></script>
</body>
</html>
