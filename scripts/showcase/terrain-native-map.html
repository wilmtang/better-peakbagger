<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { position: relative; background: linear-gradient(145deg, #d4dfca, #ece5c9); }
    svg { width: 100%; height: 100%; }
    .contour { fill: none; stroke: rgba(91, 104, 75, .38); stroke-width: 1.2; }
    .route-shadow, .route { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .route-shadow { stroke: #fff; stroke-width: 9; }
    .route { stroke: #d9483b; stroke-width: 5; }
    /* Peakbagger's Leaflet map keeps its zoom at the bottom-right, above the
       attribution — mirror that (class and all) so the floating toggle's
       zoom-stack measurement has a realistic target to sit above. */
    .leaflet-bottom { position: absolute; bottom: 0; right: 0; max-width: 100%; }
    .leaflet-control { float: right; clear: both; }
    .leaflet-control-zoom { display: grid; overflow: hidden; margin: 0 10px 10px 0; border: 1px solid #abb2a5; border-radius: 5px; background: #fff; box-shadow: 0 2px 6px rgb(0 0 0 / 16%); }
    .leaflet-control-zoom a { display: block; width: 30px; height: 30px; text-align: center; text-decoration: none; background: #fff; color: #000; font: bold 22px/30px Arial, sans-serif; }
    .leaflet-control-zoom a + a { border-top: 1px solid #d2d6cf; }
    .leaflet-control-attribution { box-sizing: border-box; max-width: 100%; padding: 0 5px; background: rgb(255 255 255 / 80%); color: #333; font: 11px/1.5 "Helvetica Neue", Arial, sans-serif; }
    .leaflet-control-attribution a { color: #0078a8; }
  </style>
</head>
<body>
  <select id="selmap" hidden aria-hidden="true">
    <option value="L_FIX" selected>Synthetic topographic map</option>
  </select>
  <svg viewBox="0 0 800 450" preserveAspectRatio="none" aria-hidden="true">
    <path class="contour" d="M-20 390 C150 300 245 410 420 330 S690 240 840 315"/>
    <path class="contour" d="M-30 335 C145 245 270 355 430 275 S680 185 850 255"/>
    <path class="contour" d="M-35 275 C130 205 260 285 410 220 S675 130 850 185"/>
    <path class="contour" d="M-30 215 C135 145 250 220 395 165 S650 72 835 115"/>
    <path class="route-shadow" d="M385 420 C370 348 390 278 378 220 S392 92 401 35"/>
    <path class="route" d="M385 420 C370 348 390 278 378 220 S392 92 401 35"/>
  </svg>
  <div class="leaflet-bottom leaflet-right">
      <div class="leaflet-control-zoom leaflet-bar leaflet-control"><a href="#" role="button" aria-label="Zoom in">+</a><a href="#" role="button" aria-label="Zoom out">−</a></div>
      <div class="leaflet-control-attribution leaflet-control"><a href="https://leafletjs.com">Leaflet</a> | OT:Basemap © <a href="https://opentopomap.org">OpenTopoMap</a> contributors, CC-BY-SA, Copernicus Sentinel-2 / Microsoft Planetary Computer</div>
    </div>
  <script>
    const basemap = {
      _url: `${location.origin}/scripts/showcase/terrain-tiles/{z}/{x}/{y}.png`,
      options: {
        tileSize: 256,
        minZoom: 0,
        maxZoom: 18,
        attribution: 'OT:Basemap © OpenTopoMap contributors, CC-BY-SA, Copernicus Sentinel-2 / Microsoft Planetary Computer'
      }
    };
    window.L = {
      Browser: { retina: false },
      circleMarker(latLng, options) {
        return {
          _map: null,
          latLng,
          options,
          addTo(map) { this._map = map; return this; },
          setLatLng(next) { this.latLng = next; return this; },
          setStyle(next) { Object.assign(this.options, next); return this; }
        };
      }
    };
    window.mapsPlaceholder = {
      _layers: { basemap },
      eachLayer(callback) { Object.values(this._layers).forEach(callback); },
      on() { return this; },
      off() { return this; },
      hasLayer: layer => layer === basemap
    };
  </script>
</body>
</html>
