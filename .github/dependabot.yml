# Dependency updates.
#
# Grouping is a correctness requirement here, not a convenience. The
# `@tiptap/*`, `@codemirror/*`, and `@lezer/*` families carry peer
# relationships and are released in lockstep, so a lone bump of one member
# against an unchanged sibling is precisely the breakage to avoid. Grouping
# also collapses a TipTap release from ten pull requests into one.
#
# The groups still mirror what reaches users, which is worth knowing when a
# rehearsal fails and the cause has to be attributed. Both runtime groups are
# third-party code shipped with the extension; their names distinguish WXT/Vite
# bundling from copying a prebuilt browser file intact. `package.json` lists
# every dependency under devDependencies; `tooling` and `jsdom` are genuinely
# development-only, while the `svelte` group ships only the `svelte` client
# runtime (`svelte`, `clsx`, `esm-env`) into bundles importing components.
#
# Every npm group merges automatically once the four required checks pass; see
# `.github/workflows/dependabot-auto-merge.yml`. The last two npm groups are
# coordination catch-alls: unmatched version updates stay together instead of
# deadlocking the zero-advisory gate in separate pull requests, while GitHub
# requires security updates to use a distinct group. Cooldown is the only delay
# left in the version-update path, so it carries more weight than it would if a
# human were reading each pull request: it is what lets an ecosystem find a bad
# release before this repository takes it. GitHub Actions updates remain grouped
# but wait for review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Every other Monday at 09:00 UTC. Dependabot uses Fugit's modulo
    # extension; a day-of-month step would reset at each month boundary.
    schedule:
      interval: cron
      cronjob: "0 9 * * mon%2"
      timezone: Etc/UTC
    # Raise every matching manifest minimum, even when its current caret range
    # already admits the new release. This is load-bearing for lockstep families
    # such as TipTap: grouping alone does not make an already-satisfied sibling
    # appear in the pull request.
    # TipTap also uses exact manifest pins: untouched caret ranges previously
    # resolved newer siblings despite this strategy (PR #19).
    versioning-strategy: increase
    # One per version-update group.
    open-pull-requests-limit: 6
    # Version updates wait out their initial release churn. Security updates
    # ignore cooldown and still arrive immediately.
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 21
    # Keep the compiler within the peer range admitted by the TS/Svelte tools.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The jsdom tests are typed by @types/jsdom, which trails jsdom's majors
      # (jsdom 31 exists; @types/jsdom 31 does not). Hold both majors and lift
      # both rules together once matching majors exist; the `jsdom` group then
      # moves them in one pull request.
      - dependency-name: jsdom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/jsdom"
        update-types: [version-update:semver-major]
    groups:
      # Bundled into the shipped extension by WXT (direct and transitive).
      bundled-runtime:
        patterns:
          - "@tiptap/*"
          - "@codemirror/*"
          - "@lezer/*"
          - "@mapbox/vector-tile"
          - "@mapbox/point-geometry"
          - "@maplibre/vt-pbf"
          - "@marijn/find-cluster-break"
          - crelt
          - jszip
          - linkifyjs
          - orderedmap
          - pbf
          - prosemirror-commands
          - prosemirror-dropcursor
          - prosemirror-gapcursor
          - prosemirror-history
          - prosemirror-keymap
          - prosemirror-model
          - prosemirror-schema-list
          - prosemirror-state
          - prosemirror-tables
          - prosemirror-transform
          - prosemirror-view
          - rope-sequence
          - style-mod
          - suncalc
          - tz-lookup
          - w3c-keyname
      # Copied into dist/vendor as browser builds.
      copied-runtime:
        patterns:
          - chart.js
          - maplibre-gl
          - marked
      # Build and test only. Never reaches dist/, so never reaches a user.
      tooling:
        patterns:
          - esbuild
          - eslint
          - fake-indexeddb
          - globals
          - playwright
          - selenium-webdriver
          - web-ext
          - typescript
          - typescript-eslint
          - jiti
          - "@types/node"
          - "@types/chrome"
          # Coordinate WXT, its compiler, and its parser upgrades.
          - wxt
          - vite
          - rolldown

      # The Svelte compiler/runtime (and its shipped helpers `clsx` / `esm-env`)
      # plus the tools that check and lint it. They move together so a compiler
      # release cannot outpace its checker or lint parser.
      svelte:
        patterns:
          - svelte
          - clsx
          - esm-env
          - svelte-check
          - eslint-plugin-svelte
          - svelte-eslint-parser

      # Test only. jsdom and its declarations must change majors together.
      jsdom:
        patterns:
          - jsdom
          - "@types/jsdom"

      # GitHub assigns an update to the first matching group. Keep this last
      # among version-update rules so named release-path groups retain their
      # boundaries while otherwise ungrouped direct and transitive updates move
      # together. Their shipping status must be traced through the owning path.
      remaining-npm:
        applies-to: version-updates
        patterns:
          - "*"

      # Security and version updates cannot share a Dependabot pull request.
      # Group every npm security repair so the global zero-advisory gate does
      # not make independently incomplete security pull requests block forever.
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"

  # Action bumps wait for review because they are the one ecosystem whose risk
  # the release rehearsal cannot cover: they change what CI itself runs,
  # including the release workflow that holds the Chrome workload-identity and
  # AMO credentials. The rehearsal exercises the extension, never the workflow
  # that publishes it. Their cooldown is deliberately longer than npm's, but it
  # is defense in depth rather than authorization to merge.
  - package-ecosystem: github-actions
    directory: /
    # Manual-review updates arrive on the first day of each month at 09:00 UTC.
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    groups:
      actions:
        patterns:
          - "*"
