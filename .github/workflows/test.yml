name: Test

# A pull request branch on this repository would otherwise match both triggers
# and run every job twice, which for a Dependabot update means eight jobs and
# four browser smokes where four and two would do. Pushes to main still run the
# suite after a merge.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check dependency advisories
        run: npm run audit:ci

      - name: Check immutable release history
        run: npm run release:check-history

      - name: Run tests
        run: npm test

      - name: Lint source and extension
        run: npm run lint

  scale:
    name: Scale tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run scale tests
        run: npm run test:scale

  chrome:
    name: Chrome extension smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chrome for Testing
        run: npx playwright install --with-deps chromium

      - name: Verify the real Chrome extension
        # Chrome 151 on Linux new-headless can omit declared content scripts on
        # the ascent fixture while the same binary passes under an isolated
        # virtual display. Xvfb stays hidden and never touches a user session.
        env:
          BPB_VERIFY_HEADLESS: "false"
        run: xvfb-run -a npm run verify:chrome

  chrome-floor:
    name: Chrome 128 extension smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chrome 128 for Testing
        id: chrome-floor
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: 128
          install-dependencies: true

      - name: Verify the real Chrome 128 extension
        env:
          CHROME_BIN: ${{ steps.chrome-floor.outputs.chrome-path }}
        run: npm run verify:chrome

  firefox:
    name: Firefox ${{ matrix.firefox }} extension smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        firefox:
          - "152.0"
          - latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Firefox
        # v1.7.2 — SHA-tracked by Dependabot, so this one is not auto-maintained.
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795
        with:
          firefox-version: ${{ matrix.firefox }}

      - name: Install geckodriver
        # Pinned to a commit on this action's `latest` branch, which is where its
        # built index.js lives. Do not pin master or a source commit: they carry
        # no bundle and fail with "File not found: index.js". Its only tag,
        # v0.0.0, is a build that predates the `token` input, and without a token
        # the geckodriver release lookup is unauthenticated and shares a GitHub
        # API rate limit with every runner on the same IP.
        uses: browser-actions/setup-geckodriver@fac5b0424c584257f32cf12c5eb4ba86014c34f8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the real Firefox extension
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: npm run verify:firefox
