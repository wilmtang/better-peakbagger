name: Test

# A pull request branch on this repository would otherwise match both triggers
# and run every job twice. Pushes to main still run the suite after a merge.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Explicit bash preserves verifier failures through tee (pipefail).
defaults:
  run:
    shell: bash

jobs:
  dependency-impact:
    name: Detect dependency impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      copied-runtime: ${{ steps.impact.outputs.copied-runtime }}
    steps:
      - name: Check out source and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect terrain runtime and verification changes
        id: impact
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/copied-runtime-impact.mjs "$BASE_REVISION"

  node:
    name: Node tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up shared verification
        uses: ./.github/actions/setup-verification

      - name: Check dependency advisories
        # Owner-reviewed exact dev-only node-forge chain; the enforced expiry
        # is defined by DEVELOPMENT_ADVISORY in scripts/check-npm-audit.mjs.
        # Release verification selects the same exact reviewed exception.
        run: npm run audit:ci -- --allow-reviewed-development-advisory

      - name: Check immutable release history
        run: npm run release:check-history

      - name: Run tests
        run: npm test

      - name: Lint source and extension
        run: npm run lint

  scale:
    name: Scale tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up shared verification
        uses: ./.github/actions/setup-verification

      - name: Run scale tests
        run: npm run test:scale

  chrome:
    name: Chrome current extension smoke
    # Chrome 151 on hosted Linux omits command-line extensions in both new
    # headless and Xvfb. Use the standard 4-core Intel macOS runner because the
    # full verifier is load-sensitive on the smaller 3-core arm64 runner.
    # Chrome 128 remains the Linux floor.
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      BPB_VERIFY_ARTIFACTS: browser-evidence
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up shared verification
        uses: ./.github/actions/setup-verification
        with:
          chrome-version: current
          firefox-version: latest
          popup-firefox: 'true'

      - name: Verify packages and capture flows
        uses: ./.github/actions/verify-package

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-chrome
          path: browser-evidence/
          if-no-files-found: ignore
          retention-days: 7

  fixture-preflight:
    name: Fixture preflight (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      BPB_VERIFY_SCREENSHOTS: failure
      BPB_JITTER_ARTIFACTS: browser-evidence/preflight
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up shared verification
        uses: ./.github/actions/setup-verification
        with:
          fixture-browser: ${{ matrix.browser }}

      - name: Verify fixture contracts before long matrices
        run: |
          mkdir -p browser-evidence
          npm run verify -- fixture-preflight --${{ matrix.browser }}-only 2>&1 | tee browser-evidence/preflight.log

      - name: Retain preflight failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-preflight-${{ matrix.browser }}
          path: browser-evidence/
          if-no-files-found: ignore
          retention-days: 7

  layout:
    name: Interaction layout stability (${{ matrix.browser }}, ${{ matrix.shard }}/4)
    # These load bundles into fixtures, not unpacked extensions. Linux leaves
    # scarce macOS slots for the real-manifest, native toolbar and GPU checks.
    needs: [fixture-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        shard: [1, 2, 3, 4]
    env:
      BPB_VERIFY_SCREENSHOTS: references
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up shared verification
        uses: ./.github/actions/setup-verification
        with:
          fixture-browser: ${{ matrix.browser }}

      - name: Verify interaction layout stability in Chrome and Firefox
        env:
          BPB_JITTER_ARTIFACTS: browser-evidence/layout-stability
        run: |
          mkdir -p browser-evidence
          npm run verify -- layout-stability --${{ matrix.browser }}-only --shard=${{ matrix.shard }}/4 2>&1 | tee browser-evidence/layout-stability.log

      - name: Retain layout failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-layout-${{ matrix.browser }}-${{ matrix.shard }}
          path: browser-evidence/
          if-no-files-found: ignore
          retention-days: 7

  peak-surfaces:
    name: Peak surface (${{ matrix.browser }}, ${{ matrix.surface }})
    needs: [fixture-preflight]
    runs-on: macos-15-intel
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Keep capacity for package/native-toolbar and hardware GPU jobs.
      max-parallel: 4
      matrix:
        browser: [chrome, firefox]
        surface: [snow, cards, cards-placement, interactions]
    env:
      BPB_VERIFY_SCREENSHOTS: references
      BPB_VERIFY_ARTIFACTS: browser-evidence/peak-surfaces
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up shared verification
        uses: ./.github/actions/setup-verification
        with:
          chrome-version: ${{ matrix.browser == 'chrome' && 'current' || 'none' }}
          firefox-version: ${{ matrix.browser == 'firefox' && 'latest' || 'none' }}

      - name: Build shipped fixture assets
        run: npm run build

      - name: Verify independent peak surface
        env:
          BROWSER: ${{ matrix.browser }}
          SURFACE: ${{ matrix.surface }}
          BPB_VERIFY_SNOW_SCREENSHOT_DIR: browser-evidence/snow
          BPB_VERIFY_PEAK_CARDS_SCREENSHOT_DIR: browser-evidence/peak-cards
          BPB_VERIFY_WEATHER_INTERACTIONS_SCREENSHOT_DIR: browser-evidence/weather-interactions
        run: |
          case "$BROWSER" in
            chrome) browser_args=() ;;
            firefox) browser_args=(--firefox) ;;
            *) echo "Unknown browser: $BROWSER" >&2; exit 1 ;;
          esac
          case "$SURFACE" in
            snow|cards|cards-placement|interactions) ;;
            *) echo "Unknown surface: $SURFACE" >&2; exit 1 ;;
          esac
          mkdir -p browser-evidence
          node scripts/verify-ascent-weather.mjs --"$SURFACE" "${browser_args[@]}" 2>&1 | tee "browser-evidence/$SURFACE.log"

      - name: Retain peak surface failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-peak-${{ matrix.browser }}-${{ matrix.surface }}
          path: browser-evidence/
          if-no-files-found: ignore
          retention-days: 7

  snow-map:
    name: SNOTEL map GPU (${{ matrix.browser }})
    # Hardware WebGL is required; each verifier rejects software fallback.
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      BPB_VERIFY_ARTIFACTS: browser-evidence
      BPB_VERIFY_SNOW_MAP_SCREENSHOT_DIR: browser-evidence/snow-map
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up shared verification
        uses: ./.github/actions/setup-verification
        with:
          chrome-version: current
          firefox-version: latest

      - name: Verify snow map on hardware GPU
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          mkdir -p browser-evidence
          case "$BROWSER" in
            chrome) browser_args=() ;;
            firefox) browser_args=(--firefox) ;;
            *) echo "Unknown browser: $BROWSER" >&2; exit 1 ;;
          esac
          npm run build
          node scripts/verify-ascent-weather.mjs --snow-map "${browser_args[@]}" 2>&1 | tee browser-evidence/snow-map.log

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-snow-map-${{ matrix.browser }}
          path: browser-evidence/
          if-no-files-found: ignore
          retention-days: 7

  chrome-floor:
    name: Chrome 128 extension smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BPB_VERIFY_ARTIFACTS: browser-evidence
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up shared verification
        uses: ./.github/actions/setup-verification
        with:
          chrome-version: '128'

      - name: Verify the real Chrome 128 extension
        run: |
          mkdir -p browser-evidence
          npm run verify -- chrome 2>&1 | tee browser-evidence/verify-chrome.log

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-chrome-floor
          path: browser-evidence/
          if-no-files-found: ignore
          retention-days: 7

  firefox:
    name: Firefox ${{ matrix.firefox }} extension smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BPB_VERIFY_ARTIFACTS: browser-evidence
    strategy:
      fail-fast: false
      matrix:
        firefox:
          - "152.0"
          - latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up shared verification
        uses: ./.github/actions/setup-verification
        with:
          firefox-version: ${{ matrix.firefox }}

      - name: Verify the real Firefox extension
        run: |
          mkdir -p browser-evidence
          npm run verify -- firefox 2>&1 | tee browser-evidence/verify-firefox.log

      - name: Verify capture with pending page resources
        run: |
          mkdir -p browser-evidence
          npm run verify -- capture-readiness firefox 2>&1 | tee browser-evidence/verify-capture-readiness-firefox.log

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-firefox-${{ matrix.firefox }}
          path: browser-evidence/
          if-no-files-found: ignore
          retention-days: 7

  chrome-terrain:
    name: Chrome copied-runtime GPU smoke
    needs: dependency-impact
    if: needs.dependency-impact.outputs.copied-runtime == 'true'
    # Standard macOS 15 is an arm64 M1 runner. The verifier reports the WebGL
    # renderer and fails closed if the hosted environment exposes software GL.
    runs-on: macos-15
    timeout-minutes: 20
    env:
      BPB_VERIFY_ARTIFACTS: browser-evidence
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chrome for Testing
        run: npx playwright install chromium

      - name: Verify copied runtime on Chrome GPU
        run: |
          mkdir -p browser-evidence
          npm run verify -- terrain chrome browser-evidence/terrain 2>&1 | tee browser-evidence/terrain-verify.log

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-chrome-terrain
          path: browser-evidence/
          if-no-files-found: ignore
          retention-days: 7

  chrome-required:
    name: Chrome extension smoke
    needs:
      - dependency-impact
      - chrome
      - chrome-floor
      - chrome-terrain
      - layout
      - fixture-preflight
      - peak-surfaces
      - snow-map
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Chrome smoke and conditional GPU success
        env:
          IMPACT_RESULT: ${{ needs.dependency-impact.result }}
          COPIED_RUNTIME: ${{ needs.dependency-impact.outputs.copied-runtime }}
          CHROME_RESULT: ${{ needs.chrome.result }}
          CHROME_FLOOR_RESULT: ${{ needs.chrome-floor.result }}
          LAYOUT_RESULT: ${{ needs.layout.result }}
          PREFLIGHT_RESULT: ${{ needs.fixture-preflight.result }}
          SURFACE_RESULT: ${{ needs.peak-surfaces.result }}
          SNOW_MAP_RESULT: ${{ needs.snow-map.result }}
          GPU_RESULT: ${{ needs.chrome-terrain.result }}
        run: |
          test "$IMPACT_RESULT" = success
          test "$CHROME_RESULT" = success
          test "$CHROME_FLOOR_RESULT" = success
          test "$LAYOUT_RESULT" = success
          test "$PREFLIGHT_RESULT" = success
          test "$SURFACE_RESULT" = success
          test "$SNOW_MAP_RESULT" = success
          if test "$COPIED_RUNTIME" = true; then
            test "$GPU_RESULT" = success
          else
            test "$GPU_RESULT" = skipped
          fi

  firefox-terrain:
    name: Firefox copied-runtime GPU smoke
    needs: dependency-impact
    if: needs.dependency-impact.outputs.copied-runtime == 'true'
    # Firefox uses ANGLE Metal on macOS; native OpenGL stalls in hosted VMs.
    runs-on: macos-15
    timeout-minutes: 20
    env:
      BPB_VERIFY_ARTIFACTS: browser-evidence
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install isolated Firefox
        run: npx playwright install firefox

      - name: Verify copied runtime on Firefox GPU
        run: |
          mkdir -p browser-evidence
          npm run verify -- terrain firefox 2>&1 | tee browser-evidence/terrain-verify-firefox.log

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-firefox-terrain
          path: browser-evidence/
          if-no-files-found: ignore
          retention-days: 7

  firefox-required:
    # The main ruleset requires this stable name. Matrix job names include the
    # browser version and therefore cannot satisfy that rule directly.
    name: Firefox extension smoke
    needs:
      - dependency-impact
      - firefox
      - firefox-terrain
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Firefox matrix and conditional GPU success
        env:
          IMPACT_RESULT: ${{ needs.dependency-impact.result }}
          COPIED_RUNTIME: ${{ needs.dependency-impact.outputs.copied-runtime }}
          FIREFOX_RESULT: ${{ needs.firefox.result }}
          GPU_RESULT: ${{ needs.firefox-terrain.result }}
        run: |
          test "$IMPACT_RESULT" = success
          test "$FIREFOX_RESULT" = success
          if test "$COPIED_RUNTIME" = true; then
            test "$GPU_RESULT" = success
          else
            test "$GPU_RESULT" = skipped
          fi
