name: Test

# A pull request branch on this repository would otherwise match both triggers
# and run every job twice, which for a Dependabot update means eight jobs and
# four browser smokes where four and two would do. Pushes to main still run the
# suite after a merge.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check dependency advisories
        run: npm run audit:ci

      - name: Lint source
        run: npm run lint:js

      - name: Run tests
        run: npm test

      - name: Lint extension
        run: npm run lint

  scale:
    name: Scale tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run scale tests
        run: npm run test:scale

  chrome:
    name: Chrome extension smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chrome for Testing
        run: npx playwright install --with-deps chromium

      - name: Verify the real Chrome extension
        run: npm run verify:chrome

  firefox:
    name: Firefox extension smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Firefox
        # v1.7.2 — SHA-tracked by Dependabot, so this one is not auto-maintained.
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795
        with:
          firefox-version: latest

      - name: Install geckodriver
        # Pinned to master rather than a tag: this action's only tag is v0.0.0,
        # which is the commit being replaced here. `token` landed after it and is
        # the reason for the move — without it the geckodriver release lookup is
        # unauthenticated and shares a GitHub API rate limit with every runner on
        # the same IP, which is how this job failed on 70956ad.
        uses: browser-actions/setup-geckodriver@bf8266f624ca122cedb6d0381a031f18f6c431cd
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the real Firefox extension
        run: npm run verify:firefox
