name: Release browser extensions

on:
  workflow_dispatch:
    inputs:
      ci_run:
        description: Successful full main Test run for this exact commit (within 24 hours)
        required: true
        type: string
      repetitions:
        description: Consecutive successful checks per browser (1 is diagnostic only)
        type: choice
        options: ['1', '3', '5']
        default: '3'
  push:
    tags:
      - "v*"

# Serialize the entire upload/review/publication transaction across every tag.
# Read-only rehearsals do not hold the store publication lock.
concurrency:
  group: ${{ github.event_name == 'push' && 'browser-store-publication' || format('browser-release-rehearsal-{0}', github.run_id) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      artifact-id: ${{ steps.packages.outputs.artifact-id }}
      identity-sha256: ${{ steps.candidate.outputs.identity-sha256 }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up shared verification
        uses: ./.github/actions/setup-verification
      - name: Check early release readiness
        run: npm run release:readiness
      - name: Validate version and listing metadata
        run: |
          version="$(node -p 'require("./manifest.json").version')"
          npm run release:check -- "v$version" --metadata-only
          npm run release:metadata:firefox
      - name: Fetch protected main tip
        if: github.event_name == 'push'
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Validate tag and protected-main ancestry
        if: github.event_name == 'push'
        run: npm run release:check -- "$GITHUB_REF_NAME" --require-protected-main
      - name: Check immutable release history
        run: npm run release:check-history
      # Require zero advisories in shipped code under the reviewed audit policy.
      - name: Check dependency advisories
        run: npm run audit:ci
      - name: Enforce the complete TypeScript adoption policy
        run: npm run check:typescript-policy -- --base d7bc366311ccb384d9460eb17d68872e986d6a35
      - name: Acquire trusted exact packages and verification evidence
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          BPB_CI_RUN: ${{ inputs.ci_run }}
          BPB_MODE: ${{ github.event_name == 'workflow_dispatch' && 'rehearsal' || 'publication' }}
        run: node scripts/release-evidence.mts "$BPB_MODE"
      - name: Preserve frozen candidate packages
        id: packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-candidate-${{ github.run_attempt }}
          path: release-package/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  compatibility:
    name: Packaged ${{ matrix.browser }} ${{ matrix.version }}
    needs: prepare
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      EXPECTED_IDENTITY: ${{ needs.prepare.outputs.identity-sha256 }}
      BPB_VERIFY_ARTIFACTS: browser-evidence
      BPB_VERIFY_REPETITIONS: ${{ inputs.repetitions }}
      BROWSER: ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            version: current
            runner: macos-15-intel
            chrome: current
            firefox: none
          - browser: firefox
            version: current
            runner: macos-15-intel
            chrome: none
            firefox: latest
          - browser: chrome
            version: "128"
            runner: ubuntu-24.04
            chrome: "128"
            firefox: none
          - browser: firefox
            version: "152.0"
            runner: ubuntu-24.04
            chrome: none
            firefox: "152.0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up selected browser
        uses: ./.github/actions/setup-verification
        with:
          chrome-version: ${{ matrix.chrome }}
          firefox-version: ${{ matrix.firefox }}
      - name: Download frozen candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: release-package
          merge-multiple: true
      - name: Verify downloaded package identity
        run: node scripts/release-package-identity.mts verify release-package "$RELEASE_VERSION" "$GITHUB_SHA" "$EXPECTED_IDENTITY"
      - name: Execute exact archive in the selected browser
        run: |
          mkdir -p browser-evidence
          node scripts/verify-packaged-extensions.mts \
            "release-package/better_peakbagger-${RELEASE_VERSION}.zip" \
            "release-package/better_peakbagger-${RELEASE_VERSION}-firefox.zip" \
            --browser "$BROWSER" 2>&1 | tee browser-evidence/packages.log
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-browser-failure-${{ matrix.browser }}-${{ matrix.version }}-${{ github.run_attempt }}
          path: browser-evidence/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: Verify release
    needs: [prepare, compatibility]
    # A skipped browser matrix is expected only for promotion on a tag. An
    # explicit always condition prevents skipped needs from silently propagating.
    if: ${{ always() && needs.prepare.result == 'success' && (needs.compatibility.result == 'success' || (github.event_name == 'push' && needs.compatibility.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ needs.prepare.outputs.version }}
      artifact-name: browser-extension-v${{ needs.prepare.outputs.version }}-${{ github.run_attempt }}
      identity-sha256: ${{ needs.prepare.outputs.identity-sha256 }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      EXPECTED_IDENTITY: ${{ needs.prepare.outputs.identity-sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download frozen candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: release-package
          merge-multiple: true
      - name: Verify downloaded package identity
        run: node scripts/release-package-identity.mts verify release-package "$RELEASE_VERSION" "$GITHUB_SHA" "$EXPECTED_IDENTITY"
      - name: Preserve verified store packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-extension-v${{ needs.prepare.outputs.version }}-${{ github.run_attempt }}
          path: release-package/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  chrome-upload:
    name: Upload Chrome Web Store
    needs: [verify]
    outputs:
      receipt-id: ${{ steps.receipt.outputs.artifact-id }}
      receipt-sha256: ${{ steps.receipt-hash.outputs.sha256 }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      EXPECTED_IDENTITY: ${{ needs.verify.outputs.identity-sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: browser-stores
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out publisher script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up locked verification dependencies
        uses: ./.github/actions/setup-verification
      - name: Download verified store package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: release-package
      - name: Revalidate fresh publication evidence after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-evidence.mts revalidate
          npm run audit:ci
      - name: Check Chrome publisher configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
        run: |
          for name in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT CHROME_PUBLISHER_ID CHROME_EXTENSION_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing browser-stores variable: $name" >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload Chrome draft without publishing
        env:
          CHROME_WEBSTORE_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
        run: |
          node scripts/release-evidence.mts assert-fresh
          node scripts/publish-chrome.mts upload "release-package/better_peakbagger-${RELEASE_VERSION}.zip" chrome-upload-receipt.json
      - name: Pin upload receipt and explain the required review
        id: receipt-hash
        run: |
          echo "sha256=$(sha256sum chrome-upload-receipt.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Chrome metadata review required
          Expected version: **${RELEASE_VERSION}**. Inspect the latest draft in the [Chrome Developer Dashboard](https://chrome.google.com/webstore/devconsole).
          Confirm the expected version and clear Google's missing requirements, including permission justifications and URL checks, before approving **chrome-metadata-review**.
          The receipt proves which bytes this job sent (or an existing submission it reconciled); the v2 API cannot identify the current unsubmitted draft's digest. Avoid external draft uploads or edits during this transaction.
          Review the maintained copy in store-assets/release-readiness.json. Do not approve based only on local URL probes.
          EOF
      - name: Preserve upload receipt
        id: receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-upload-receipt-${{ github.run_attempt }}
          path: chrome-upload-receipt.json
          if-no-files-found: error
          retention-days: 7

  chrome-metadata:
    name: Review Chrome metadata
    needs: [verify, chrome-upload]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: chrome-metadata-review
      url: https://chrome.google.com/webstore/devconsole
    permissions:
      actions: read
    env:
      EXPECTED_RECEIPT: ${{ needs.chrome-upload.outputs.receipt-sha256 }}
    steps:
      # This job starts only after the owner approves the version and Google's
      # validation in the dashboard. It receives no store credentials or OIDC.
      - name: Download pinned upload receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.chrome-upload.outputs.receipt-id }}
          path: receipt
          merge-multiple: true
      - name: Verify reviewed receipt
        run: printf '%s  %s\n' "$EXPECTED_RECEIPT" receipt/chrome-upload-receipt.json | sha256sum --check --strict

  chrome:
    name: Submit Chrome Web Store
    needs: [verify, chrome-upload, chrome-metadata]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      EXPECTED_IDENTITY: ${{ needs.verify.outputs.identity-sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: browser-stores
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out publisher script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up locked verification dependencies
        uses: ./.github/actions/setup-verification
      - name: Download verified store package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: release-package
      - name: Revalidate fresh publication evidence after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-evidence.mts revalidate
          npm run audit:ci
      - name: Download pinned upload receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.chrome-upload.outputs.receipt-id }}
          path: receipt
          merge-multiple: true
      - name: Verify reviewed receipt
        env:
          EXPECTED_RECEIPT: ${{ needs.chrome-upload.outputs.receipt-sha256 }}
        run: printf '%s  %s\n' "$EXPECTED_RECEIPT" receipt/chrome-upload-receipt.json | sha256sum --check --strict
      - name: Check Chrome publisher configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
        run: |
          for name in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT CHROME_PUBLISHER_ID CHROME_EXTENSION_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing browser-stores variable: $name" >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Publish reviewed Chrome draft without uploading
        env:
          CHROME_WEBSTORE_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
        run: |
          node scripts/release-evidence.mts assert-fresh
          node scripts/publish-chrome.mts publish "release-package/better_peakbagger-${RELEASE_VERSION}.zip" receipt/chrome-upload-receipt.json --metadata-reviewed

  firefox:
    name: Submit Firefox Add-ons
    needs: [verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      EXPECTED_IDENTITY: ${{ needs.verify.outputs.identity-sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: browser-stores
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download verified store packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: release-package

      - name: Verify downloaded package identity
        run: node scripts/release-package-identity.mts verify release-package "$RELEASE_VERSION" "$GITHUB_SHA" "$EXPECTED_IDENTITY"

      - name: Revalidate tagged source and fresh evidence after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run release:check -- "$GITHUB_REF_NAME"
          node scripts/release-evidence.mts revalidate
          npm run audit:ci

      - name: Create Firefox listing metadata
        run: npm run release:metadata:firefox

      - name: Prepare verified Firefox source
        run: |
          mkdir -p web-ext-artifacts/firefox-source
          unzip -q release-package/*-firefox.zip -d web-ext-artifacts/firefox-source

      - name: Check Firefox publisher configuration
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "Missing AMO_JWT_ISSUER or AMO_JWT_SECRET in browser-stores" >&2
            exit 1
          fi

      - name: Confirm the Firefox version is unused
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run release:check:firefox-version -- "$RELEASE_VERSION" --require-unused

      - name: Submit Firefox package for review
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          node scripts/release-evidence.mts assert-fresh
          npm run release:sign:firefox
