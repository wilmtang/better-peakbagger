name: Release browser extensions

on:
  # Read-only rehearsal: the same package gates run without store credentials.
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: browser-store-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  scale:
    name: Release scale tests
    # Keep the CPU ceiling on the same runner class as ordinary scale CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up shared verification
        uses: ./.github/actions/setup-verification

      - name: Run scale tests
        run: npm run test:scale

  verify:
    name: Verify release
    needs: scale
    # Current Chrome 151 omits command-line extensions on hosted Linux. Keep
    # exact-package verification on the less load-sensitive standard Intel
    # macOS runner; the declared browser floors still run separately on Linux.
    runs-on: macos-15-intel
    timeout-minutes: 25
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
    env:
      BPB_VERIFY_ARTIFACTS: browser-evidence
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up shared verification
        uses: ./.github/actions/setup-verification
        with:
          chrome-version: current
          firefox-version: latest

      - name: Validate version and listing metadata before package gates
        id: metadata
        run: |
          version="$(node -p 'require("./manifest.json").version')"
          npm run release:check -- "v$version" --metadata-only
          npm run release:metadata:firefox
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact-name=browser-extension-v${version}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Fetch protected main tip
        if: github.event_name == 'push'
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Validate tag, protected-main ancestry, and version metadata
        if: github.event_name == 'push'
        run: npm run release:check -- "$GITHUB_REF_NAME" --require-protected-main

      - name: Check immutable release history
        run: npm run release:check-history

      # The test workflow runs this too, but nothing makes a release wait for
      # that workflow, and test/project/dependency-audit.test.mjs only exercises
      # evaluateAudit() against synthetic reports — it never calls npm audit. The
      # The default requires zero advisories. The owner accepts the exact
      # dev-only node-forge advisory for releases
      # until October 17. The audit evaluator enforces its dependency graph
      # and expiry; every other finding still fails.
      - name: Check dependency advisories
        run: npm run audit:ci -- --allow-reviewed-development-advisory

      - name: Run tests
        run: npm test

      - name: Lint source and extension
        run: npm run lint

      - name: Build and execute verified store packages
        run: |
          mkdir -p browser-evidence
          npm run release:verify-packages 2>&1 | tee browser-evidence/packages.log

      - name: Record verified package identity
        run: node scripts/release-package-identity.mjs write web-ext-artifacts "${{ steps.metadata.outputs.version }}" "$GITHUB_SHA"

      - name: Retain package verifier failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-browser-failure-${{ github.run_attempt }}
          path: browser-evidence/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve verified store packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: |
            web-ext-artifacts/*.zip
            web-ext-artifacts/package-identity.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  compatibility:
    name: Packaged ${{ matrix.browser }} ${{ matrix.version }} floor
    needs: verify
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      BPB_VERIFY_ARTIFACTS: browser-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            version: "128"
          - browser: firefox
            version: "152.0"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up shared verification
        uses: ./.github/actions/setup-verification
        with:
          chrome-version: ${{ matrix.browser == 'chrome' && matrix.version || 'none' }}
          firefox-version: ${{ matrix.browser == 'firefox' && matrix.version || 'none' }}

      - name: Download verified store packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: release-package

      - name: Verify downloaded package identity
        run: node scripts/release-package-identity.mjs verify release-package "$RELEASE_VERSION" "$GITHUB_SHA"

      - name: Execute the packaged extension at its browser floor
        run: |
          mkdir -p browser-evidence
          version="${RELEASE_VERSION}"
          if [ "${{ matrix.browser }}" = chrome ]; then
            BPB_VERIFY_EXTENSION_SOURCE="release-package/better_peakbagger-${version}.zip"
            mkdir floor-extension
            unzip -q "$BPB_VERIFY_EXTENSION_SOURCE" -d floor-extension
            BPB_VERIFY_EXTENSION_SOURCE=floor-extension node scripts/verify-extension.mjs 2>&1 | tee browser-evidence/floor.log
          else
            BPB_VERIFY_EXTENSION_SOURCE="release-package/better_peakbagger-${version}-firefox.zip" \
              node scripts/verify-firefox-extension.mjs 2>&1 | tee browser-evidence/floor.log
          fi

      - name: Retain floor failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-floor-failure-${{ matrix.browser }}-${{ github.run_attempt }}
          path: browser-evidence/
          if-no-files-found: ignore
          retention-days: 7

  chrome:
    name: Submit Chrome Web Store
    needs: [verify, compatibility]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: browser-stores
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out publisher script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download verified store package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: release-package

      - name: Verify downloaded package identity
        run: node scripts/release-package-identity.mjs verify release-package "$RELEASE_VERSION" "$GITHUB_SHA"

      - name: Check Chrome publisher configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
        run: |
          for name in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT CHROME_PUBLISHER_ID CHROME_EXTENSION_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing browser-stores variable: $name" >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Submit Chrome package for review
        env:
          CHROME_WEBSTORE_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
        run: |
          chrome_archive="release-package/better_peakbagger-${RELEASE_VERSION}.zip"
          node scripts/publish-chrome.mjs "$chrome_archive"

  firefox:
    name: Submit Firefox Add-ons
    needs: [verify, compatibility]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: browser-stores
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download verified store packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: release-package

      - name: Verify downloaded package identity
        run: node scripts/release-package-identity.mjs verify release-package "$RELEASE_VERSION" "$GITHUB_SHA"

      - name: Revalidate tagged source
        run: npm run release:check -- "$GITHUB_REF_NAME"

      - name: Create Firefox listing metadata
        run: npm run release:metadata:firefox

      - name: Prepare verified Firefox source
        run: |
          mkdir -p web-ext-artifacts/firefox-source
          unzip -q release-package/*-firefox.zip -d web-ext-artifacts/firefox-source

      - name: Check Firefox publisher configuration
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "Missing AMO_JWT_ISSUER or AMO_JWT_SECRET in browser-stores" >&2
            exit 1
          fi

      - name: Confirm the Firefox version is unused
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run release:check:firefox-version -- "$RELEASE_VERSION" --require-unused

      - name: Submit Firefox package for review
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run release:sign:firefox
