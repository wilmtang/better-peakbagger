name: Release browser extensions

on:
  push:
    tags:
      - "v*"

concurrency:
  group: browser-store-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate tag and version metadata
        run: npm run release:check -- "$GITHUB_REF_NAME"

      # The test workflow runs this too, but nothing makes a release wait for
      # that workflow, and test/project/dependency-audit.test.mjs only exercises
      # evaluateAudit() against synthetic reports — it never calls npm audit. The
      # gate accepts no finding of any severity in any package, so the build that
      # actually reaches both stores has to run it.
      - name: Check dependency advisories
        run: npm run audit:ci

      - name: Lint source
        run: npm run lint:js

      - name: Run tests
        run: npm test

      - name: Run scale tests
        run: npm run test:scale

      - name: Lint extension
        run: npm run lint

      - name: Build store packages
        run: |
          npm run package
          chrome_archive="web-ext-artifacts/better_peakbagger-${GITHUB_REF_NAME#v}.zip"
          firefox_archive="${chrome_archive%.zip}-firefox.zip"
          npm run build:firefox -- "$chrome_archive" "$firefox_archive"

      - name: Verify store package contents
        run: |
          chrome_archive="web-ext-artifacts/better_peakbagger-${GITHUB_REF_NAME#v}.zip"
          firefox_archive="${chrome_archive%.zip}-firefox.zip"
          npm run release:verify-archive -- "$chrome_archive" chrome
          npm run release:verify-archive -- "$firefox_archive" firefox

      - name: Install Chrome for Testing
        run: npx playwright install --with-deps chromium

      - name: Install Firefox
        # v1.7.2 — SHA-tracked by Dependabot, so this one is not auto-maintained.
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795
        with:
          firefox-version: latest

      - name: Install geckodriver
        # Pinned to a commit on this action's `latest` branch, which is where its
        # built index.js lives. Do not pin master or a source commit: they carry
        # no bundle and fail with "File not found: index.js". Its only tag,
        # v0.0.0, is a build that predates the `token` input, and without a token
        # the geckodriver release lookup is unauthenticated and shares a GitHub
        # API rate limit with every runner on the same IP.
        uses: browser-actions/setup-geckodriver@fac5b0424c584257f32cf12c5eb4ba86014c34f8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute store packages in both browsers
        run: |
          chrome_archive="web-ext-artifacts/better_peakbagger-${GITHUB_REF_NAME#v}.zip"
          firefox_archive="${chrome_archive%.zip}-firefox.zip"
          npm run verify:packages -- "$chrome_archive" "$firefox_archive"

      - name: Preserve verified store packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-extension-${{ github.ref_name }}
          path: web-ext-artifacts/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  chrome:
    name: Submit Chrome Web Store
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: browser-stores
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out publisher script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download verified store package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-extension-${{ github.ref_name }}
          path: release-package

      - name: Check Chrome publisher configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
        run: |
          for name in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT CHROME_PUBLISHER_ID CHROME_EXTENSION_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing browser-stores variable: $name" >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Submit Chrome package for review
        env:
          CHROME_WEBSTORE_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
        run: |
          chrome_archive="release-package/better_peakbagger-${GITHUB_REF_NAME#v}.zip"
          node scripts/publish-chrome.mjs "$chrome_archive"

  firefox:
    name: Submit Firefox Add-ons
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: browser-stores
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download verified store packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-extension-${{ github.ref_name }}
          path: release-package

      - name: Revalidate tagged source
        run: npm run release:check -- "$GITHUB_REF_NAME"

      - name: Create Firefox listing metadata
        run: npm run release:metadata:firefox

      - name: Prepare verified Firefox source
        run: |
          mkdir -p web-ext-artifacts/firefox-source
          unzip -q release-package/*-firefox.zip -d web-ext-artifacts/firefox-source

      - name: Check Firefox publisher configuration
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "Missing AMO_JWT_ISSUER or AMO_JWT_SECRET in browser-stores" >&2
            exit 1
          fi

      - name: Submit Firefox package for review
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run release:sign:firefox
