name: Dependabot auto-merge

# Queues GitHub's native auto-merge on every Dependabot pull request. The merge
# still waits for all four required checks in the `main` ruleset; this workflow
# only sets the flag, and Dependabot holds no bypass.
#
# Nothing here publishes. A merge only updates `main`; the store release runs
# solely from a manually pushed `vX.Y.Z` tag, behind the manual release
# rehearsal in docs/releasing.md. That rehearsal — real Chrome and Firefox
# profiles, a live capture, native popup presentation — is the gate that
# catches a dependency which breaks the rendered result rather than behavior,
# because no automated check here can.
#
# The privilege boundary matters more than the convenience. This uses
# `pull_request`, not `pull_request_target`, never checks out or executes the
# branch, and runs no step that reads the diff, so the contents of a pull
# request cannot influence what happens here.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  auto-merge:
    name: Auto-merge dependency updates
    # Dependabot's own pull requests, from a branch on this repository.
    if: >-
      github.repository == 'wilmtang/better-peakbagger'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Retained for its verification, not its outputs: with `skip-verification`
      # left at its default this fails the job unless every commit on the branch
      # is a verified Dependabot commit. That is what stops an extra commit
      # pushed onto an open Dependabot branch from riding an automatic merge in,
      # and it is the last check standing now that no group waits for a human.
      # It also means a hand-pushed fixup on a Dependabot branch stops the
      # automatic merge, which is the intended direction.
      - name: Verify the branch carries only Dependabot commits
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Queue the merge once required checks pass
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
