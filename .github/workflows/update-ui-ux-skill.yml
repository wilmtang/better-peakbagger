name: Update UI/UX skill

on:
  schedule:
    - cron: '17 15 1 * *'
  workflow_dispatch:
  # Refresh the automation branch when main advances so strict required checks
  # cannot leave a pending skill update permanently behind its base branch.
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: update-ui-ux-skill
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    if: github.repository == 'wilmtang/better-peakbagger' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check for a pending update
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            pending="$(gh pr list --repo "$GITHUB_REPOSITORY" --head codex/update-ui-ux-skill --base main --state open --json number --jq length)"
            if [ "$pending" = 0 ]; then exit 0; fi
          fi
          echo 'update=true' >> "$GITHUB_OUTPUT"

      - name: Require the repository-scoped automation token
        if: steps.pending.outputs.update == 'true'
        env:
          SKILL_UPDATE_TOKEN: ${{ secrets.SKILL_UPDATE_TOKEN }}
        run: |
          if [ -z "$SKILL_UPDATE_TOKEN" ]; then
            echo 'Set SKILL_UPDATE_TOKEN to a repository-only token with Contents and Pull requests write permissions.' >&2
            exit 1
          fi

      # This trusted helper only downloads, verifies and merges files. Never
      # execute downloaded Python or instruction content in this publishing job.
      # The ordinary read-only PR checks validate the proposed skill instead.
      - name: Integrate pinned upstream changes
        if: steps.pending.outputs.update == 'true'
        run: node scripts/update-ui-ux-skill.mjs

      - name: Create or refresh the skill update pull request
        if: steps.pending.outputs.update == 'true'
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.SKILL_UPDATE_TOKEN }}
          branch: codex/update-ui-ux-skill
          base: main
          delete-branch: true
          add-paths: .agents/skills/ui-ux-pro-max
          commit-message: 'chore: update ui ux skill from upstream'
          title: 'chore: update ui ux skill from upstream'
          body: |
            Updates the vendored UI/UX skill to the upstream commit recorded in UPSTREAM.md.

            Preserves project guidance through a three-way merge and retains the license and shared discovery symlink. Conflicts, modified local helpers, unsupported layouts, and license changes stop the update.

            GitHub merges this PR automatically after the existing required checks pass. Skill data validation and Python CLI regressions run within Node tests and lint.

      - name: Queue and confirm the checked merge
        if: steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ secrets.SKILL_UPDATE_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --merge \
            --match-head-commit "$HEAD_SHA" \
            --subject "Merge branch 'codex/update-ui-ux-skill' into main"
          state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,headRefOid,autoMergeRequest)"
          if ! jq -e --arg head "$HEAD_SHA" '
            .headRefOid == $head and (
              .state == "MERGED" or (
                .state == "OPEN" and .autoMergeRequest.mergeMethod == "MERGE"
              )
            )
          ' <<<"$state" >/dev/null; then
            echo 'The verified head was not confirmed merged or queued for auto-merge.' >&2
            exit 1
          fi
          echo "Skill update PR #$PR_NUMBER is merged or queued behind required checks." >> "$GITHUB_STEP_SUMMARY"
