<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BC parcel maps — Better Peakbagger</title>
  <script src="access-head.js"></script>
  <link rel="stylesheet" href="../css/panel.css">
  <link rel="stylesheet" href="../css/gaia-access.css">
  <link rel="stylesheet" href="../css/bc-land-access.css">
</head>
<body>
  <main class="access-card">
    <img src="../icons/icon-48.png" width="48" height="48" alt="">
    <p class="eyebrow">BETTER PEAKBAGGER</p>
    <h1>BC parcel maps</h1>
    <p class="explanation">Allow access to <strong>maps.gov.bc.ca</strong> to show provincial parcel ownership on your map.</p>
    <p class="boundary">Coverage is partial. Ownership does not establish camping permission.</p>
    <button id="allow-bc-land" type="button" aria-disabled="false">Allow access</button>
    <p id="bc-land-access-status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script src="access.js"></script>
</body>
</html>
